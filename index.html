let order = [], current = 0, score = 0, answered = false;
const el = id => document.getElementById(id);
function shuffle(items) {
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function startGame() {
  order = shuffle(cards);
  current = 0;
  score = 0;
  el("game").style.display = "block";
  el("finish").style.display = "none";
  showQuestion();
}
function showQuestion() {
  answered = false;
  const card = order[current];
  el("round").textContent = `שאלה ${current + 1} מתוך ${order.length}`;
  el("score").textContent = `ניקוד: ${score}`;
  el("progress").style.width = `${current / order.length * 100}%`;
  el("picture").src = card.image;
  el("picture").alt = "איור המתאר " + card.word;
  el("feedback").textContent = "";
  el("feedback").style.color = "";
  el("next").disabled = true;
  el("next").textContent = current === order.length - 1 ? "לתוצאות" : "לשאלה הבאה ←";
  el("answers").replaceChildren();
  shuffle(cards.map(item => item.word)).forEach(word => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "answer";
    button.textContent = word;
    button.addEventListener("click", () => chooseAnswer(button, word, card.word));
    el("answers").appendChild(button);
  });
}
function chooseAnswer(selected, chosen, correct) {
  if (answered) return;
  answered = true;
  document.querySelectorAll(".answer").forEach(button => {
    button.disabled = true;
    if (button.textContent === correct) button.classList.add("correct");
  });
  if (chosen === correct) {
    score++;
    el("feedback").textContent = "נכון מאוד! ⭐";
    el("feedback").style.color = "#23845d";
  } else {
    selected.classList.add("wrong");
    el("feedback").textContent = "כמעט! התשובה הנכונה היא: " + correct;
    el("feedback").style.color = "#b43d3d";
  }
  el("score").textContent = `ניקוד: ${score}`;
  el("progress").style.width = `${(current + 1) / order.length * 100}%`;
  el("next").disabled = false;
}
el("next").addEventListener("click", () => {
  if (!answered) return;
  current++;
  if (current < order.length) showQuestion();
  else {
    el("game").style.display = "none";
    el("finish").style.display = "block";
    el("result").textContent = `ענית נכון על ${score} מתוך ${cards.length} שאלות.`;
  }
});
el("restart").addEventListener("click", startGame);
startGame();
